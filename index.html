<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carta dei Vini — Palinurobar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  /* ── PALETTE NEON PALINUROBAR ── */
  --neon-red:#e8001a;
  --neon-pink:#e8001a;
  --neon-glow:rgba(232,0,26,.45);
  --neon-glow-soft:rgba(232,0,26,.18);
  --neon-white:#fff;
  --bg-dark:#0a0608;
  --bg-dark2:#0e080b;
  --surface:#120a0d;
  --surface2:#1a0d12;

  /* Sidebar */
  --hero:#1a0d12;--hero2:#0e080b;
  /* Testo sul dark */
  --ink:rgba(255,255,255,.88);
  --ink-2:rgba(255,255,255,.65);
  --ink-3:rgba(255,255,255,.42);
  --ink-4:rgba(255,255,255,.25);
  /* Linee */
  --line:rgba(232,0,26,.12);
  --line-s:rgba(232,0,26,.08);
  /* Vecchi alias */
  --grey:rgba(255,255,255,.35);
  --gold:#ff1f5a;
  /* Tipografia */
  --font-serif:'Playfair Display',Georgia,serif;
  --font-sans:'DM Sans','Helvetica Neue',sans-serif;
  /* BG globale */
  --bg:var(--bg-dark);
  --bg-alt:rgba(232,0,26,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg-dark);
  color:var(--ink);
  font-family:var(--font-sans);font-size:14px;line-height:1.6;
  max-width:100%;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}

/* ═══════════════════════════════════════════════════════════════
   NEON TEXT UTILITY
   ═══════════════════════════════════════════════════════════════ */
.neon-text{
  color:#fff;
  text-shadow:
    0 0 4px #fff,
    0 0 10px #fff,
    0 0 20px var(--neon-pink),
    0 0 40px var(--neon-pink),
    0 0 70px var(--neon-pink);
}
.neon-text-dim{
  color:rgba(255,255,255,.75);
  text-shadow:
    0 0 3px rgba(255,255,255,.6),
    0 0 8px var(--neon-pink),
    0 0 18px var(--neon-pink);
}

/* ═══════════════════════════════════════════════════════════════
   DESKTOP (≥1024px)
   ═══════════════════════════════════════════════════════════════ */
@media(min-width:1024px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:row;height:100vh}

  /* ── SIDEBAR ── */
  .sidebar-col{
    width:300px;min-width:300px;flex-shrink:0;
    height:100vh;display:flex;flex-direction:column;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(232,0,26,.12) 0%, transparent 60%),
      linear-gradient(180deg, #120a0d 0%, #0a0608 100%);
    border-right:1px solid rgba(232,0,26,.12);
    box-shadow: inset -1px 0 0 rgba(232,0,26,.08), 3px 0 20px rgba(0,0,0,.5);
    overflow:hidden;
    position:relative;
  }
  .sidebar-col::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,0,26,.4),transparent);
    z-index:1;pointer-events:none;
  }

  /* ── LOGO AREA ── */
  .sidebar-brand{
    flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 20px 24px;
    gap:0;
  }
  .brand-logo-neon{
    width:460px;max-width:100%;height:auto;
    display:block;
    margin-bottom:22px;
    filter:
      drop-shadow(0 0 4px rgba(255,255,255,1))
      drop-shadow(0 0 14px rgba(255,255,255,.85))
      drop-shadow(0 0 30px var(--neon-pink))
      drop-shadow(0 0 60px var(--neon-pink))
      drop-shadow(0 0 100px rgba(232,0,26,.3));
  }
  .brand-logo2{
    width:210px;max-width:100%;height:auto;
    display:block;
    margin-bottom:18px;
    opacity:.8;
    filter:none;
  }
  .brand-sep{
    width:32px;height:1px;
    background:rgba(232,0,26,.4);
    box-shadow:0 0 8px var(--neon-pink),0 0 18px rgba(232,0,26,.2);
    margin-bottom:14px;
  }
  .brand-text-name{
    font-family:'Bebas Neue',var(--font-sans);
    font-weight:400;
    font-size:1.05rem;
    letter-spacing:.4em;
    text-transform:uppercase;
    color:rgba(255,255,255,.55);
    text-align:center;
    line-height:1;
    text-shadow:0 0 10px rgba(255,255,255,.12);
  }
    .brand-text-name{
    font-family:var(--font-sans);
    font-weight:300;
    font-size:.8rem;
    letter-spacing:.45em;
    text-transform:uppercase;
    color:rgba(255,255,255,.35);
    text-align:center;
    line-height:1;
  }
  .brand-sep{
    width:28px;height:1px;
    background:rgba(232,0,26,.3);
    margin-top:0;
    box-shadow:0 0 6px var(--neon-pink);
  }

  /* ── NAV BUTTONS (stile neon) ── */
  .nav-views{
    flex-shrink:0;
    padding:8px 18px 16px;
    display:flex;flex-direction:column;gap:8px;
  }
  .btn-view{
    display:flex;align-items:flex-start;flex-direction:column;gap:3px;
    width:100%;padding:13px 20px;
    border:1px solid rgba(232,0,26,.15);
    border-radius:0;
    background:transparent;
    color:rgba(255,255,255,.3);
    font-family:'Bebas Neue',var(--font-sans);font-size:22px;font-weight:400;
    letter-spacing:.12em;text-transform:uppercase;
    transition:all .2s ease;
    position:relative;overflow:hidden;
    text-align:left;line-height:1;
  }
  .btn-view::before{display:none}
  .btn-view .btn-icon{display:none}
  .btn-view-sub{
    font-size:8px;letter-spacing:.03em;text-transform:none;font-weight:300;
    opacity:.5;transition:opacity .18s;color:rgba(255,255,255,.45);display:block;
  }
  .btn-view:hover .btn-view-sub,.btn-view.active .btn-view-sub{opacity:1}
  .btn-view:hover{
    background:rgba(232,0,26,.06);
    color:rgba(255,255,255,.8);
    border-color:rgba(232,0,26,.4);
    text-shadow:0 0 10px rgba(255,255,255,.6),0 0 24px var(--neon-pink),0 0 48px var(--neon-pink);
    box-shadow:0 0 16px rgba(232,0,26,.12),inset 0 0 10px rgba(232,0,26,.05);
  }
  .btn-view.active{
    background:rgba(232,0,26,.08);
    color:#fff;
    border-color:rgba(232,0,26,.6);
    text-shadow:0 0 8px #fff,0 0 20px var(--neon-pink),0 0 40px var(--neon-pink),0 0 80px rgba(232,0,26,.4);
    box-shadow:0 0 20px rgba(232,0,26,.18),inset 0 0 12px rgba(232,0,26,.07);
    font-weight:400;
  }

  /* ── FILTRI ── */
  .sidebar-filters{
    flex:1;overflow:hidden;
    display:flex;flex-direction:column;
    max-height:0;opacity:0;
    transition:max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    pointer-events:none;
  }
  .sidebar-filters.visible{max-height:100vh;opacity:1;pointer-events:auto;}
  .sidebar-filters #sidebar-inner{flex:1;overflow-y:auto;padding:16px 0 8px;}
  .sidebar-filters #sidebar-inner::-webkit-scrollbar{width:2px}
  .sidebar-filters #sidebar-inner::-webkit-scrollbar-thumb{background:rgba(232,0,26,.3)}

  /* ── WINE COLUMN ── */
  .wine-col{
    flex:1;height:100vh;overflow-y:auto;min-width:0;
    display:block;
    background:#0a0608;
    padding:40px 32px 60px;
    box-sizing:border-box;
  }
  .wine-col::-webkit-scrollbar{width:4px}
  .wine-col::-webkit-scrollbar-thumb{background:rgba(232,0,26,.2)}
  .wine-col .page-wrap{
    width:100%;max-width:820px;
    margin:0 auto;
    background:rgba(10,6,8,.6);
    box-shadow:0 0 40px rgba(232,0,26,.04);
    border-radius:0;
    min-height:calc(100vh - 100px);
    padding-bottom:80px;
    box-sizing:border-box;
  }

  /* ── SEARCH BAR ── */
  .search-bar-wrap{
    width:100%;padding:24px 52px 0;box-sizing:border-box;
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .35s ease,opacity .3s ease,padding .3s ease;
  }
  .search-bar-wrap.visible{max-height:80px;opacity:1;padding:24px 52px 0}
  .search-bar-inner{position:relative}
  .search-input{
    width:100%;padding:11px 40px 11px 16px;
    border:1px solid rgba(232,0,26,.2);border-radius:0;
    background:rgba(232,0,26,.04);color:var(--ink);
    font-family:inherit;font-size:14px;outline:none;
    box-shadow:0 0 12px rgba(232,0,26,.05);
    transition:border-color .2s,box-shadow .2s;
  }
  .search-input:focus{
    border-color:rgba(232,0,26,.5);
    box-shadow:0 0 16px rgba(232,0,26,.12),inset 0 0 8px rgba(232,0,26,.04);
  }
  .search-input::placeholder{color:rgba(255,255,255,.2)}
  .search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:rgba(255,255,255,.3);display:none;line-height:1;padding:0;background:none;border:none;cursor:pointer}
  .search-clear.show{display:block}

  .wine-col .sort-bar{width:100%;padding:16px 52px 12px;box-sizing:border-box;background:transparent;border-bottom:none}
  .wine-col .main-content{width:100%;padding:28px 52px 52px;box-sizing:border-box}

  .mobile-landing{display:none!important}
  .btn-back-mobile{display:none!important}
  .filter-fab{display:none!important}
  body>.hero,body>.search-wrap{display:none}
}

/* ═══════════════════════════════════════════════════════════════
   STILI COMUNI
   ═══════════════════════════════════════════════════════════════ */
.sb-acc-wrap{margin:0 0 2px;overflow:hidden;}
.sb-acc-wrap:hover{background:rgba(232,0,26,.04)}
.sb-acc-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;cursor:pointer;user-select:none;
  border-bottom:1px solid rgba(232,0,26,.1);
}
.sb-acc-title{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);
}
.sb-acc-arrow{font-size:8px;color:rgba(232,0,26,.4);transition:transform .25s ease}
.sb-acc-wrap.open .sb-acc-arrow{transform:rotate(180deg)}
.sb-acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .2s ease;padding:0 20px}
.sb-acc-wrap.open .sb-acc-body{max-height:340px;overflow-y:auto;padding:0 20px 10px}
.cat-list{list-style:none;display:flex;flex-direction:column;gap:0}
.cat-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 0;cursor:pointer;
  border-bottom:1px solid rgba(232,0,26,.08);
  transition:opacity .1s;font-family:var(--font-sans);
}
.cat-item:last-child{border-bottom:none}
.cat-item:hover{opacity:.7}
.cat-item.active .cat-label{color:rgba(255,255,255,.95);font-weight:500;text-shadow:0 0 8px rgba(255,255,255,.4),0 0 16px var(--neon-pink)}
.cat-item.active .cat-count{color:rgba(255,255,255,.6)}
.cat-item.cat-empty{opacity:.2;pointer-events:none}
.cat-dot{width:5px;height:5px;border-radius:50%;background:rgba(232,0,26,.3);flex-shrink:0}
.cat-label{flex:1;font-size:12px;font-weight:400;color:rgba(255,255,255,.5);letter-spacing:.01em}
.cat-count{font-size:10px;color:rgba(255,255,255,.25);font-weight:400;font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.sb-filter-list{list-style:none;display:flex;flex-direction:column}
.sb-filter-item{
  font-family:var(--font-sans);font-size:11.5px;font-weight:400;
  color:rgba(255,255,255,.45);padding:6px 0;
  border-bottom:1px solid rgba(232,0,26,.06);cursor:pointer;
  transition:color .1s;
}
.sb-filter-item:last-child{border-bottom:none}
.sb-filter-item:hover{color:rgba(255,255,255,.9)}
.sb-filter-item.active{color:#fff;font-weight:500;text-shadow:0 0 6px rgba(255,255,255,.4),0 0 12px var(--neon-pink)}
.dual-range-wrap{position:relative;height:32px;margin:4px 10px 0}
.dual-range-track{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:2px;background:rgba(232,0,26,.15);border-radius:2px}
.dual-range-fill{position:absolute;top:50%;transform:translateY(-50%);height:2px;background:var(--neon-pink);border-radius:2px;box-shadow:0 0 6px var(--neon-pink)}
.dual-range-wrap input[type=range]{position:absolute;width:100%;top:50%;transform:translateY(-50%);-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;height:20px}
.dual-range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;pointer-events:auto;cursor:pointer;box-shadow:0 0 6px var(--neon-pink),0 0 12px var(--neon-pink)}
.price-row{display:flex;justify-content:space-between;padding:0 10px;font-size:10.5px;color:rgba(255,255,255,.35);margin-top:6px}
.btn-reset-all{
  font-family:var(--font-sans);font-size:9px;font-weight:400;
  letter-spacing:.1em;text-transform:uppercase;
  color:rgba(232,0,26,.35);padding:10px 20px;
  transition:color .15s,text-shadow .15s;background:none;border:none;cursor:pointer;
  display:block;width:100%;text-align:left;
}
.btn-reset-all:hover{color:var(--neon-pink);text-shadow:0 0 8px var(--neon-pink)}
.sort-bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--line)}
.sort-label{font-family:var(--font-sans);font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sort-select{
  border:1px solid rgba(232,0,26,.2);border-radius:0;
  background:rgba(232,0,26,.04);color:var(--ink);
  font-family:var(--font-sans);font-size:11px;padding:4px 8px;
  outline:none;cursor:pointer;letter-spacing:.02em;
}
.sort-select option{background:#120a0d;color:#fff}
.results-bar{margin-bottom:24px}
.results-count{
  font-family:var(--font-sans);font-size:9px;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);
}
.sezione{margin-bottom:44px}
.sezione-titolo{
  font-family:var(--font-sans);font-size:10px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--neon-pink);
  padding:0 0 9px 16px;
  border-bottom:1px solid rgba(232,0,26,.15);
  margin-bottom:0;
  text-shadow:0 0 8px rgba(232,0,26,.5);
}

/* ── RIGA VINO ── */
.vino{
  display:flex;align-items:stretch;
  border-bottom:1px solid rgba(232,0,26,.07);
  cursor:pointer;
  transition:background .15s ease;
  position:relative;
}
.vino:hover{background:rgba(232,0,26,.04)}
.vino:first-child{border-top:1px solid rgba(232,0,26,.07)}

.w-accent-bar{
  width:2px;background:var(--accent,rgba(232,0,26,.3));
  flex-shrink:0;opacity:.7;
}
.w-body{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:13px 16px 13px 14px;gap:16px;flex:1;min-width:0;
}
.w-sx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.w-nome{
  font-family:var(--font-serif);font-size:15px;font-weight:400;
  letter-spacing:.01em;color:rgba(255,255,255,.88);line-height:1.3;
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
}
.w-annata{
  font-family:var(--font-sans);font-size:11px;font-weight:400;
  color:rgba(255,255,255,.4);letter-spacing:.02em;
}
.w-formato{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--neon-pink);opacity:.8;
}
.w-meta{
  font-family:var(--font-sans);font-size:11px;
  color:rgba(255,255,255,.5);display:flex;align-items:center;
  gap:5px;flex-wrap:wrap;
}
.w-prod{
  font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;font-size:10px;
}
.w-vitigno{font-style:italic;color:rgba(255,255,255,.35)}
.w-tipo-label{
  font-size:9px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;opacity:.85;
}
.w-geo{
  font-family:var(--font-sans);font-size:10px;font-weight:400;
  color:rgba(255,255,255,.25);letter-spacing:.03em;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
}
.w-sep{
  color:rgba(232,0,26,.4);font-style:normal;
  font-weight:300;opacity:.6;user-select:none;
}
.w-dx{flex-shrink:0;text-align:right}
.w-price-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.w-price{
  font-family:var(--font-sans);font-size:16px;font-weight:400;
  font-variant-numeric:tabular-nums;
  color:#fff;
  letter-spacing:-.01em;white-space:nowrap;
  text-shadow:0 0 8px rgba(255,255,255,.25);
}
.w-calice{
  font-family:var(--font-sans);font-size:10px;
  font-weight:400;color:rgba(232,0,26,.7);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.w-calice::before{content:"↑ ";opacity:.6;font-size:9px}

/* legacy compat */
.vino-calice .w-accent-bar{opacity:.3}
.vino-sx,.vino-dx,.vino-nome,.vino-prod,.vino-vitigno,
.vino-geo,.vino-prezzo,.vino-bicchiere,.vino-annata,
.vino-formato-badge,.vino-regione,.vino-paese-tag,.vino-geo-sep{}
.main-content{padding:20px 20px 40px}
.vuoto{padding:40px 20px;text-align:center;color:var(--grey);font-size:14px;line-height:1.8}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex}
.modal-card{
  background:#0e080b;
  border:1px solid rgba(232,0,26,.2);
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:0;
  box-shadow:0 0 40px rgba(232,0,26,.15),0 16px 48px rgba(0,0,0,.6);
  position:relative;
}
.modal-hero-div{
  background:linear-gradient(135deg,rgba(232,0,26,.15),rgba(232,0,26,.05));
  border-bottom:1px solid rgba(232,0,26,.2);
  padding:28px 28px 22px;position:relative;overflow:hidden;border-radius:0;
}
.modal-hero-doodle{position:absolute;right:-20px;top:-10px;height:120%;pointer-events:none;opacity:.18;mix-blend-mode:screen}
.modal-cat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--neon-pink);margin-bottom:6px;position:relative;z-index:1;text-shadow:0 0 8px var(--neon-pink)}
.modal-nome{font-family:var(--font-serif);font-size:22px;font-weight:400;color:#fff;line-height:1.25;position:relative;z-index:1;text-shadow:0 0 20px rgba(255,255,255,.2)}
.modal-annata{font-size:13px;color:rgba(255,255,255,.45);margin-top:4px;position:relative;z-index:1}
.modal-prezzo{display:flex;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line)}
.modal-p-item{display:flex;flex-direction:column;gap:2px}
.modal-p-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(232,0,26,.6)}
.modal-p-val{font-family:var(--font-sans);font-size:20px;font-weight:300;color:#fff;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.modal-body{padding:22px 28px}
.modal-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.modal-lbl{color:rgba(232,0,26,.5);min-width:90px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding-top:2px;font-weight:600}
.modal-val{color:rgba(255,255,255,.75);font-weight:400}
.modal-close{position:absolute;top:14px;right:16px;font-size:20px;line-height:1;color:rgba(255,255,255,.3);background:none;border:none;cursor:pointer;padding:4px;z-index:5;transition:color .15s}
.modal-close:hover{color:var(--neon-pink);text-shadow:0 0 8px var(--neon-pink)}

/* ── DRAWER ── */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;backdrop-filter:blur(4px)}
.drawer-overlay.show{display:block}
.filter-drawer{
  position:fixed;bottom:0;left:0;right:0;z-index:110;
  background:#0e080b;
  border-top:1px solid rgba(232,0,26,.2);
  border-radius:0;
  max-height:78vh;overflow-y:auto;
  overscroll-behavior:contain;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  padding:0 20px 40px;
  -webkit-overflow-scrolling:touch;
}
.filter-drawer.open{transform:translateY(0)}
.filter-drawer::before{
  content:'';display:block;
  width:28px;height:1px;
  background:rgba(232,0,26,.3);
  margin:16px auto 4px;
  box-shadow:0 0 6px var(--neon-pink);
}
.drawer-handle{display:none}
.drawer-hdr{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0 14px;
  border-bottom:1px solid rgba(232,0,26,.12);
  margin-bottom:4px;
}
.drawer-hdr span{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.35);
}
.drawer-hdr button{font-size:18px;line-height:1;color:rgba(255,255,255,.3);background:none;border:none;cursor:pointer;padding:0;}
.drawer-body{padding:0 0 60px}
.drawer-apply{
  position:sticky;bottom:0;padding:10px 0;
  background:#0e080b;border-top:1px solid rgba(232,0,26,.12);
}
.drawer-apply button{
  width:100%;padding:12px;
  background:rgba(232,0,26,.12);color:#fff;
  border:1px solid rgba(232,0,26,.3);
  font-family:var(--font-sans);font-size:10px;font-weight:400;
  letter-spacing:.18em;text-transform:uppercase;
  border-radius:0;cursor:pointer;
  transition:all .15s;
  text-shadow:0 0 8px rgba(255,255,255,.3);
}
.drawer-apply button:hover{
  background:rgba(232,0,26,.2);
  border-color:rgba(232,0,26,.6);
  text-shadow:0 0 8px #fff,0 0 16px var(--neon-pink);
  box-shadow:0 0 16px rgba(232,0,26,.1);
}

/* Drawer overrides */
#filter-drawer .sb-acc-wrap{border-bottom:1px solid rgba(232,0,26,.08);margin:0}
#filter-drawer .sb-acc-head{border-bottom:1px solid rgba(232,0,26,.08);padding:10px 0}
#filter-drawer .sb-acc-title{color:rgba(255,255,255,.4)}
#filter-drawer .sb-acc-arrow{color:rgba(232,0,26,.35)}
#filter-drawer .sb-acc-body{padding:0}
#filter-drawer .sb-acc-wrap.open .sb-acc-body{padding:0 0 8px}
#filter-drawer .cat-item{border-bottom-color:rgba(232,0,26,.06);padding:7px 0}
#filter-drawer .cat-label{color:rgba(255,255,255,.6)}
#filter-drawer .cat-item.active .cat-label{color:#fff}
#filter-drawer .cat-dot{background:rgba(232,0,26,.25)}
#filter-drawer .cat-count{color:rgba(255,255,255,.25)}
#filter-drawer .sb-filter-item{color:rgba(255,255,255,.5);border-bottom-color:rgba(232,0,26,.06);padding:6px 0}
#filter-drawer .sb-filter-item:hover{color:#fff;background:none}
#filter-drawer .sb-filter-item.active{color:#fff;font-weight:500}
#filter-drawer .dual-range-track{background:rgba(232,0,26,.15)}
#filter-drawer .dual-range-fill{background:var(--neon-pink)}
#filter-drawer .dual-range-wrap input[type=range]::-webkit-slider-thumb{background:#fff;box-shadow:0 0 6px var(--neon-pink)}
#filter-drawer .price-row{color:rgba(255,255,255,.35)}
#filter-drawer .btn-reset-all{color:rgba(232,0,26,.3);padding:10px 0}
#filter-drawer .btn-reset-all:hover{color:var(--neon-pink);background:none}

/* ── FAB ── */
.filter-fab{
  display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:90;
  height:44px;padding:0 22px;
  background:rgba(232,0,26,.1);
  color:#fff;
  border:1px solid rgba(232,0,26,.35);
  border-radius:0;
  font-family:var(--font-sans);font-size:10px;font-weight:400;
  letter-spacing:.18em;text-transform:uppercase;
  align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  box-shadow:0 0 20px rgba(232,0,26,.1);
  transition:all .15s;
  white-space:nowrap;
  text-shadow:0 0 6px rgba(255,255,255,.4);
}
.filter-fab:active{background:rgba(232,0,26,.2);box-shadow:0 0 24px rgba(232,0,26,.2)}
.filter-fab .fab-icon{font-size:13px;line-height:1;opacity:.8}
.fab-badge{
  display:none;
  background:var(--neon-pink);color:#fff;
  border-radius:0;
  font-family:var(--font-sans);font-size:9px;font-weight:700;
  padding:2px 7px;
  font-variant-numeric:tabular-nums;
  line-height:1.4;
  box-shadow:0 0 8px var(--neon-pink);
}
.fab-badge.show{display:inline}

/* ── STATUS ── */
#sb-status{
  position:fixed;bottom:12px;right:14px;z-index:200;
  display:flex;align-items:center;gap:5px;
  font-family:var(--font-sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.2);
  pointer-events:none;
}
#sb-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.15);display:inline-block}
#sb-dot.ok{background:var(--neon-pink);box-shadow:0 0 6px var(--neon-pink)}
#sb-dot.sync{background:#ffd700;box-shadow:0 0 6px #ffd700;animation:pulse .8s infinite}
#sb-dot.err{background:#666}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ── LISTE CALICE/MESCITA ── */
.lista-table{width:100%;border-collapse:collapse;font-family:var(--font-sans)}
.lista-table thead th{
  font-size:9px;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(232,0,26,.6);font-weight:500;
  padding:0 0 10px;border-bottom:1px solid rgba(232,0,26,.15);
  text-align:left;
}
.lista-table thead th:last-child,.lista-table td:last-child{text-align:right}
.lista-table td.col-price{text-align:right}
.lista-row{cursor:pointer;transition:background .12s}
.lista-row:hover{background:rgba(232,0,26,.04)}
.lista-row td{padding:11px 0;border-bottom:1px solid rgba(232,0,26,.06);vertical-align:top}
.lista-nome{font-family:var(--font-serif);font-size:14px;color:rgba(255,255,255,.85)}
.lista-annata{font-family:var(--font-sans);font-size:11px;font-weight:400;color:rgba(255,255,255,.4);margin-left:6px}
.lista-prod{font-family:var(--font-sans);font-size:10px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-top:2px}
.lista-tipo{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:rgba(232,0,26,.5)}
.lista-calice,.lista-bottiglia{font-family:var(--font-sans);font-size:14px;font-weight:400;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}

/* ═══════════════════════════════════════════════════════════════
   MOBILE (≤1023px)
   ═══════════════════════════════════════════════════════════════ */
@media(max-width:1023px){
  body>.sidebar-col{display:none}
  #mobile-hero{display:none!important}

  /* ── LANDING ── */
  .mobile-landing{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100vh;padding:0 32px;
    background:radial-gradient(ellipse at 50% 20%, rgba(232,0,26,.12) 0%, transparent 60%),
               linear-gradient(180deg, #120a0d 0%, #0a0608 100%);
    position:fixed;inset:0;z-index:50;
    transition:opacity .22s ease,transform .22s ease;
    opacity:1;transform:translateY(0);
  }
  .mobile-landing.hidden{display:none!important}
  .mobile-landing.is-leaving{opacity:0;transform:translateY(-8px);pointer-events:none}

  .mobile-landing-logo-neon{
    max-width:580px;width:92%;height:auto;
    margin-bottom:20px;
    filter:
      drop-shadow(0 0 4px rgba(255,255,255,1))
      drop-shadow(0 0 14px rgba(255,255,255,.85))
      drop-shadow(0 0 30px var(--neon-pink))
      drop-shadow(0 0 60px var(--neon-pink))
      drop-shadow(0 0 100px rgba(232,0,26,.3));
  }
  .mobile-brand-logo2{
    max-width:230px;width:72%;height:auto;
    display:block;
    margin:0 auto 18px;
    opacity:.8;
    filter:none;
  }
  .mobile-landing .brand-text-name{
    font-family:'Bebas Neue',var(--font-sans);
    font-weight:400;font-size:1.1rem;
    letter-spacing:.4em;text-transform:uppercase;
    color:rgba(255,255,255,.55);
    margin-bottom:36px;text-align:center;
    text-shadow:0 0 10px rgba(255,255,255,.12);
  }
  .mobile-landing-sub{
    font-family:var(--font-sans);font-size:9px;letter-spacing:.4em;
    text-transform:uppercase;color:rgba(255,255,255,.2);margin-bottom:52px;font-weight:400;
  }
  .mobile-nav-btns{display:flex;flex-direction:column;gap:0;width:100%;max-width:340px;margin-top:4px}
  .mobile-nav-btn{
    display:flex;align-items:center;justify-content:space-between;
    width:100%;padding:20px 0;
    border:none;border-bottom:1px solid rgba(232,0,26,.12);
    background:transparent;
    color:rgba(255,255,255,.3);
    font-family:'Bebas Neue',var(--font-sans);font-size:26px;font-weight:400;
    letter-spacing:.1em;text-transform:uppercase;
    transition:all .18s;cursor:pointer;line-height:1;
  }
  .mobile-nav-btn:first-child{border-top:1px solid rgba(232,0,26,.12)}
  .mobile-nav-btn:hover,.mobile-nav-btn:active{
    color:#fff;
    text-shadow:0 0 8px #fff,0 0 20px var(--neon-pink),0 0 40px var(--neon-pink),0 0 80px rgba(232,0,26,.4);
  }
  .mobile-nav-btn .btn-arrow{font-size:16px;opacity:.3;transition:opacity .18s,transform .18s;flex-shrink:0;color:var(--neon-pink)}
  .mobile-nav-btn:hover .btn-arrow{opacity:.9;transform:translateX(3px);text-shadow:0 0 8px var(--neon-pink)}

  .filter-fab{display:none!important}
  body.mobile-list-view .filter-fab{display:flex!important}

  /* ── BACK BUTTON ── */
  .btn-back-mobile{
    display:flex!important;align-items:center;gap:8px;
    position:fixed;top:0;left:0;right:0;z-index:49;
    background:#0a0608;color:rgba(255,255,255,.5);
    padding:14px 18px;
    font-family:var(--font-sans);font-size:9px;font-weight:400;
    letter-spacing:.14em;text-transform:uppercase;
    border:none;border-bottom:1px solid rgba(232,0,26,.1);cursor:pointer;
  }
  .btn-back-mobile::before{content:"←";font-size:14px;opacity:.6;margin-right:2px;font-weight:300;letter-spacing:0}

  /* ── WINE LIST ── */
  body.mobile-list-view .wine-col{padding-top:44px}
  .wine-col{display:flex;flex-direction:column;min-height:100vh;background:#0a0608}
  .page-wrap{display:block;width:100%}
  .sezione{margin-bottom:20px}
  .sezione-titolo{font-size:10px;padding:12px 14px 10px;letter-spacing:.14em}
  .vino{padding:12px 10px 12px 14px;gap:8px}
  .w-body{padding-left:10px}
  .modal-overlay{padding:0;align-items:flex-end;backdrop-filter:none}
  .modal-card{max-width:100%;max-height:92vh;border-radius:0;margin:0}
  .modal-nome{font-size:18px}
  .modal-body{padding:14px 16px}
  .modal-prezzo{padding:10px 16px}

  /* ── HEADER STICKY ── */
  .search-bar-wrap,
  #sort-bar-wrap,
  .main-content>.results-bar{
    position:sticky;z-index:40;
    background:#0a0608;
  }
  .search-bar-wrap{
    top:44px;
    padding:10px 14px 6px;
    max-height:none!important;opacity:1!important;overflow:visible!important;
    border-top:none;
  }
  .search-bar-inner{position:relative}
  .search-bar-wrap .search-input{
    width:100%;
    padding:10px 36px 10px 14px;
    border:1px solid rgba(232,0,26,.15);
    border-radius:0;
    background:rgba(232,0,26,.03);color:rgba(255,255,255,.8);
    font-family:var(--font-sans);font-size:14px;
    outline:none;-webkit-appearance:none;
  }
  .search-bar-wrap .search-input::placeholder{color:rgba(255,255,255,.2)}
  .search-bar-wrap .search-input:focus{border-color:rgba(232,0,26,.4)}
  .search-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:17px;color:rgba(255,255,255,.3);display:none;line-height:1;padding:2px 4px;background:none;border:none;cursor:pointer}
  .search-clear.show{display:block}
  #sort-bar-wrap{
    top:calc(44px + 50px);
    padding:4px 14px 6px;
    display:flex;align-items:center;justify-content:space-between;
    border-bottom:1px solid rgba(232,0,26,.1);
  }
  .sort-bar{display:flex;align-items:center;gap:6px;padding:0;border:none;background:none}
  .sort-label{font-family:var(--font-sans);font-size:9px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.25)}
  .sort-select{border:none;border-bottom:1px solid rgba(232,0,26,.15);background:transparent;color:rgba(255,255,255,.6);font-family:var(--font-sans);font-size:11px;padding:2px 4px;outline:none;cursor:pointer;-webkit-appearance:none;appearance:none}
  .results-bar{display:inline-flex;align-items:center;margin:0}
  .results-count{font-family:var(--font-sans);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.2)}
  .main-content{padding:4px 0 80px}

  .mobile-list-view #wine-list{animation:listEnter .25s ease forwards}
  @keyframes listEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .w-nome,.w-meta,.w-prod,.w-vitigno,.w-geo,.w-annata,.w-price,.w-calice,.sezione-titolo{text-decoration:none;-webkit-text-decoration:none}
}
/* ── DESKTOP · leggibilità: testo ingrandito (~+30%) per tutti ──────────── */
@media(min-width:1024px){
  body{ font-size:16px; }
  /* nav laterale */
  .btn-view{ font-size:26px; }
  .btn-view-sub{ font-size:12px; }
  .cat-item .cat-label{ font-size:13px; }
  .cat-item .cat-count{ font-size:12px; }
  .search-input{ font-size:15px; }
  .sort-label{ font-size:12px; }
  .results-count{ font-size:12px; }
  /* titoli sezione + vista Cantina */
  .sezione-titolo{ font-size:13px; }
  .w-nome{ font-size:20px; }
  .w-annata{ font-size:14px; }
  .w-meta{ font-size:14px; }
  .w-prod{ font-size:13px; }
  .w-geo{ font-size:13px; }
  .w-tipo-label{ font-size:12px; }
  .w-formato{ font-size:12px; }
  .w-price{ font-size:21px; }
  /* vista Al Calice / Carta Breve */
  .lista-nome{ font-size:19px; }
  .lista-annata{ font-size:14px; }
  .lista-prod{ font-size:13px; }
  .lista-tipo{ font-size:13px; }
  .lista-calice,.lista-bottiglia{ font-size:19px; }
  /* modal dettaglio */
  .modal-nome{ font-size:26px; }
  .modal-p-val{ font-size:23px; }
}
</style>

<script>
// ── SIDEBAR/SEARCH VISIBILITY ─────────────────────────────────────
function _updateSidebarVisibility(view){
  var sf = document.getElementById("sidebar-filters");
  var sbw = document.getElementById("search-bar-wrap");
  var btns = document.querySelectorAll(".btn-view");
  
  // Sidebar filters visibili solo su cantina
  if(sf){ sf.classList.toggle("visible", view==="cantina"); }
  
  // Search bar visibile solo su cantina
  if(sbw){ sbw.classList.toggle("visible", view==="cantina"); }
  
  // Aggiorna active state nav buttons
  btns.forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-view")===view);
  });
}

// Override setView per agganciare visibility updates
document.addEventListener("DOMContentLoaded", function(){
  _origSetView = window.setView; // fix: assegna alla GLOBALE (riga 917), non a una locale con var
  // Dopo che carta.js carica, patcha setView
  var _patchInterval = setInterval(function(){
    if(typeof window.setView === "function" && window.setView !== _patchedSetView){
      _origSetView = window.setView;
      window.setView = _patchedSetView;
      clearInterval(_patchInterval);
      // Trigger iniziale
      _updateSidebarVisibility("calice");
    }
  }, 50);
});

function _patchedSetView(view){
  _origSetView(view);
  _updateSidebarVisibility(view);
}
var _origSetView = null;

// ── MOBILE NAVIGATION ────────────────────────────────────────────
function setViewMobile(view){
  var landing = document.getElementById("mobile-landing");
  var backBtn = document.getElementById("btn-back-mobile");
  var wineCol = document.querySelector(".wine-col");
  
  if(landing){
    landing.classList.add("is-leaving");
    setTimeout(function(){ landing.classList.add("hidden"); }, 220);
  }
  if(backBtn) backBtn.style.display = "flex";
  if(wineCol) wineCol.style.paddingTop = "44px";
  
  document.body.classList.add("mobile-list-view");
  
  // Usa setView da carta.js
  if(typeof setView === "function") setView(view);
}

function backToLanding(){
  var landing = document.getElementById("mobile-landing");
  var backBtn = document.getElementById("btn-back-mobile");
  
  if(landing){
    landing.classList.remove("hidden","is-leaving");
    landing.style.opacity = "1";
    landing.style.transform = "translateY(0)";
  }
  if(backBtn) backBtn.style.display = "none";
  document.body.classList.remove("mobile-list-view");
  
  if(typeof setView === "function") setView("landing");
}
</script>
