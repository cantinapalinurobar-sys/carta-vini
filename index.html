<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carta dei Vini — Palinurobar</title>
<meta name="theme-color" content="#0A0806">
<meta name="description" content="La carta dei vini del Palinurobar — Via Paisiello 28, Milano. Vini al calice e cantina completa, aggiornati in tempo reale.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palinurobar">
<link rel="preload" as="font" type="font/woff2" href="assets/venezia-bold.woff2" crossorigin>
<link rel="preload" as="image" href="assets/bar-1000.jpg" media="(min-width:1024px)">
<link rel="preload" as="image" href="assets/cactus-620.jpg" media="(max-width:1023px)">
<style>
:root{
  /* ── PALETTE NEON PALINUROBAR ── */
  --neon-red:#F2E6D0;
  --neon-pink:#F2E6D0;
  --neon-glow:rgba(242,230,208,.30);
  --neon-glow-soft:rgba(242,230,208,.12);
  --neon-white:#FFF8EC;
  --bg-dark:#0A0806;
  --bg-dark2:#0F0B08;
  --surface:#140F0A;
  --surface2:#1A130C;

  /* Sidebar */
  --hero:#1A130C;--hero2:#0F0B08;
  /* Testo sul dark */
  --ink:rgba(242,230,208,.88);
  --ink-2:rgba(242,230,208,.65);
  --ink-3:rgba(242,230,208,.42);
  --ink-4:rgba(242,230,208,.25);
  /* Linee */
  --line:rgba(242,230,208,.12);
  --line-s:rgba(242,230,208,.08);
  /* Vecchi alias */
  --grey:rgba(242,230,208,.35);
  --gold:#FFF8EC;
  /* Tipografia */
  --font-serif:'Playfair Display',Georgia,serif;
  --font-sans:'DM Sans','Helvetica Neue',sans-serif;
  /* BG globale */
  --bg:var(--bg-dark);
  --bg-alt:rgba(242,230,208,.04);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--bg-dark);
  color:var(--ink);
  font-family:var(--font-sans);font-size:14px;line-height:1.6;
  max-width:100%;overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;border:none;background:none;color:inherit}

/* ═══════════════════════════════════════════════════════════════
   NEON TEXT UTILITY
   ═══════════════════════════════════════════════════════════════ */
.neon-text{
  color:var(--neon-white);
  text-shadow:none;
}
.neon-text-dim{
  color:rgba(242,230,208,.75);
  text-shadow:none;
}

/* ═══════════════════════════════════════════════════════════════
   DESKTOP (≥1024px)
   ═══════════════════════════════════════════════════════════════ */
@media(min-width:1024px){
  html,body{height:100%;overflow:hidden}
  body{display:flex;flex-direction:row;height:100vh}

  /* ── SIDEBAR ── */
  .sidebar-col{
    width:300px;min-width:300px;flex-shrink:0;
    height:100vh;display:flex;flex-direction:column;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(242,230,208,.12) 0%, transparent 60%),
      linear-gradient(180deg, #140F0A 0%, #0A0806 100%);
    border-right:1px solid rgba(242,230,208,.12);
    box-shadow:3px 0 20px rgba(0,0,0,.5);
    overflow:hidden;
    position:relative;
  }
  .sidebar-col::before{
    content:"";
    position:absolute;top:0;left:0;right:0;height:1px;
    background:linear-gradient(90deg,transparent,rgba(242,230,208,.4),transparent);
    z-index:1;pointer-events:none;
  }

  /* ── LOGO AREA ── */
  .sidebar-brand{
    flex-shrink:0;
    display:flex;flex-direction:column;align-items:center;
    padding:32px 20px 24px;
    gap:0;
  }
  .brand-logo-neon{
    width:460px;max-width:100%;height:auto;
    display:block;
    margin-bottom:22px;
    filter:
      drop-shadow(0 0 4px rgba(242,230,208,1))
      drop-shadow(0 0 14px rgba(242,230,208,.85))
      drop-shadow(0 0 30px var(--neon-pink))
      drop-shadow(0 0 60px var(--neon-pink))
      drop-shadow(0 0 100px rgba(242,230,208,.3));
  }
  .brand-logo2{
    width:210px;max-width:100%;height:auto;
    display:block;
    margin-bottom:18px;
    opacity:.8;
    filter:none;
  }
  .brand-sep{
    width:32px;height:1px;
    background:rgba(242,230,208,.4);
    box-shadow:none;
    margin-bottom:14px;
  }
  .brand-text-name{
    font-family:var(--font-display);
    font-weight:400;
    font-size:1.05rem;
    letter-spacing:.4em;
    text-transform:uppercase;
    color:rgba(242,230,208,.55);
    text-align:center;
    line-height:1;
    text-shadow:none;
  }
    .brand-text-name{
    font-family:var(--font-sans);
    font-weight:300;
    font-size:.8rem;
    letter-spacing:.45em;
    text-transform:uppercase;
    color:rgba(242,230,208,.35);
    text-align:center;
    line-height:1;
  }
  .brand-sep{
    width:28px;height:1px;
    background:rgba(242,230,208,.3);
    margin-top:0;
    box-shadow:none;
  }

  /* ── NAV BUTTONS (stile neon) ── */
  .nav-views{
    flex-shrink:0;
    padding:8px 18px 16px;
    display:flex;flex-direction:column;gap:8px;
  }
  .btn-view{
    display:flex;align-items:flex-start;flex-direction:column;gap:3px;
    width:100%;padding:13px 20px;
    border:1px solid rgba(242,230,208,.15);
    border-radius:0;
    background:transparent;
    color:rgba(242,230,208,.3);
    font-family:var(--font-display);font-size:22px;font-weight:400;
    letter-spacing:.12em;text-transform:uppercase;
    transition:all .2s ease;
    position:relative;overflow:hidden;
    text-align:left;line-height:1;
  }
  .btn-view::before{display:none}
  .btn-view .btn-icon{display:none}
  .btn-view-sub{
    font-size:8px;letter-spacing:.03em;text-transform:none;font-weight:300;
    opacity:.5;transition:opacity .18s;color:rgba(242,230,208,.45);display:block;
  }
  .btn-view:hover .btn-view-sub,.btn-view.active .btn-view-sub{opacity:1}
  .btn-view:hover{
    background:rgba(242,230,208,.06);
    color:rgba(242,230,208,.8);
    border-color:rgba(242,230,208,.4);
    text-shadow:none;
    box-shadow:none;
  }
  .btn-view.active{
    background:rgba(242,230,208,.08);
    color:var(--neon-white);
    border-color:rgba(242,230,208,.6);
    text-shadow:none;
    box-shadow:none;
    font-weight:400;
  }

  /* ── FILTRI ── */
  .sidebar-filters{
    flex:1;overflow:hidden;
    display:flex;flex-direction:column;
    max-height:0;opacity:0;
    transition:max-height .4s cubic-bezier(.4,0,.2,1), opacity .3s ease;
    pointer-events:none;
  }
  .sidebar-filters.visible{max-height:100vh;opacity:1;pointer-events:auto;}
  .sidebar-filters #sidebar-inner{flex:1;overflow-y:auto;padding:16px 0 8px;}
  .sidebar-filters #sidebar-inner::-webkit-scrollbar{width:2px}
  .sidebar-filters #sidebar-inner::-webkit-scrollbar-thumb{background:rgba(242,230,208,.3)}

  /* ── WINE COLUMN ── */
  .wine-col{
    flex:1;height:100vh;overflow-y:auto;min-width:0;
    display:block;
    /* la vetrata sulla via resta ferma mentre la lista scorre */
    background:
      linear-gradient(180deg,rgba(10,8,6,.55) 0%,rgba(10,8,6,.68) 45%,rgba(10,8,6,.78) 100%),
      url(assets/interno-1600.jpg) center/cover no-repeat fixed,
      #0A0806;
    padding:40px 32px 60px;
    box-sizing:border-box;
  }
  .wine-col::-webkit-scrollbar{width:4px}
  .wine-col::-webkit-scrollbar-thumb{background:rgba(242,230,208,.2)}
  .wine-col .page-wrap{
    width:100%;max-width:820px;
    margin:0 auto;
    /* smerigliatura forte: sotto passa anche il cielo bianco della vetrata */
    background:rgba(10,8,6,.62);
    -webkit-backdrop-filter:blur(26px) saturate(1.1);backdrop-filter:blur(26px) saturate(1.1);
    box-shadow:none;
    border-radius:0;
    min-height:calc(100vh - 100px);
    padding-bottom:80px;
    box-sizing:border-box;
  }

  /* ── SEARCH BAR ── */
  .search-bar-wrap{
    width:100%;padding:24px 52px 0;box-sizing:border-box;
    max-height:0;overflow:hidden;opacity:0;
    transition:max-height .35s ease,opacity .3s ease,padding .3s ease;
  }
  .search-bar-wrap.visible{max-height:80px;opacity:1;padding:24px 52px 0}
  .search-bar-inner{position:relative}
  .search-input{
    width:100%;padding:11px 40px 11px 16px;
    border:1px solid rgba(242,230,208,.2);border-radius:0;
    background:rgba(242,230,208,.04);color:var(--ink);
    font-family:inherit;font-size:14px;outline:none;
    box-shadow:none;
    transition:border-color .2s,box-shadow .2s;
  }
  .search-input:focus{
    border-color:rgba(242,230,208,.5);
    box-shadow:none;
  }
  .search-input::placeholder{color:rgba(242,230,208,.2)}
  .search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:18px;color:rgba(242,230,208,.3);display:none;line-height:1;padding:0;background:none;border:none;cursor:pointer}
  .search-clear.show{display:block}

  .wine-col .sort-bar{width:100%;padding:16px 52px 12px;box-sizing:border-box;background:transparent;border-bottom:none}
  .wine-col .main-content{width:100%;padding:28px 52px 52px;box-sizing:border-box}

  .mobile-landing{display:none!important}
  .btn-back-mobile{display:none!important}
  .filter-fab{display:none!important}
  body>.hero,body>.search-wrap{display:none}
}

/* ═══════════════════════════════════════════════════════════════
   STILI COMUNI
   ═══════════════════════════════════════════════════════════════ */
.sb-acc-wrap{margin:0 0 2px;overflow:hidden;}
.sb-acc-wrap:hover{background:rgba(242,230,208,.04)}
.sb-acc-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 20px;cursor:pointer;user-select:none;
  border-bottom:1px solid rgba(242,230,208,.1);
}
.sb-acc-title{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.14em;text-transform:uppercase;color:rgba(242,230,208,.35);
}
.sb-acc-arrow{font-size:8px;color:rgba(242,230,208,.4);transition:transform .25s ease}
.sb-acc-wrap.open .sb-acc-arrow{transform:rotate(180deg)}
.sb-acc-body{max-height:0;overflow:hidden;transition:max-height .35s ease,padding .2s ease;padding:0 20px}
.sb-acc-wrap.open .sb-acc-body{max-height:340px;overflow-y:auto;padding:0 20px 10px}
.cat-list{list-style:none;display:flex;flex-direction:column;gap:0}
.cat-item{
  display:flex;align-items:center;gap:9px;
  padding:7px 0;cursor:pointer;
  border-bottom:1px solid rgba(242,230,208,.08);
  transition:opacity .1s;font-family:var(--font-sans);
}
.cat-item:last-child{border-bottom:none}
.cat-item:hover{opacity:.7}
.cat-item.active .cat-label{color:var(--neon-white);font-weight:700}
.cat-item.active .cat-count{color:rgba(242,230,208,.6)}
.cat-item.cat-empty{opacity:.2;pointer-events:none}
.cat-dot{width:5px;height:5px;border-radius:50%;background:rgba(242,230,208,.3);flex-shrink:0}
.cat-label{flex:1;font-size:12px;font-weight:400;color:rgba(242,230,208,.5);letter-spacing:.01em}
.cat-count{font-size:10px;color:rgba(242,230,208,.25);font-weight:400;font-variant-numeric:tabular-nums;min-width:16px;text-align:right}
.sb-filter-list{list-style:none;display:flex;flex-direction:column}
.sb-filter-item{
  font-family:var(--font-sans);font-size:11.5px;font-weight:400;
  color:rgba(242,230,208,.45);padding:6px 0;
  border-bottom:1px solid rgba(242,230,208,.06);cursor:pointer;
  transition:color .1s;
}
.sb-filter-item:last-child{border-bottom:none}
.sb-filter-item:hover{color:rgba(242,230,208,.9)}
.sb-filter-item.active{color:var(--neon-white);font-weight:700}
.dual-range-wrap{position:relative;height:32px;margin:4px 10px 0}
.dual-range-track{position:absolute;top:50%;transform:translateY(-50%);left:0;right:0;height:2px;background:rgba(242,230,208,.15);border-radius:2px}
.dual-range-fill{position:absolute;top:50%;transform:translateY(-50%);height:2px;background:var(--neon-pink);border-radius:2px;box-shadow:none}
.dual-range-wrap input[type=range]{position:absolute;width:100%;top:50%;transform:translateY(-50%);-webkit-appearance:none;appearance:none;background:transparent;pointer-events:none;height:20px}
.dual-range-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#fff;pointer-events:auto;cursor:pointer;box-shadow:none}
.price-row{display:flex;justify-content:space-between;padding:0 10px;font-size:10.5px;color:rgba(242,230,208,.35);margin-top:6px}
.btn-reset-all{
  font-family:var(--font-sans);font-size:9px;font-weight:400;
  letter-spacing:.1em;text-transform:uppercase;
  color:rgba(242,230,208,.35);padding:10px 20px;
  transition:color .15s,text-shadow .15s;background:none;border:none;cursor:pointer;
  display:block;width:100%;text-align:left;
}
.btn-reset-all:hover{color:var(--neon-pink);text-shadow:none}
.sort-bar{display:none}
.sort-bar select{display:none}
.sort-label{font-family:var(--font-sans);font-size:9px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sort-select{
  border:1px solid rgba(242,230,208,.2);border-radius:0;
  background:rgba(242,230,208,.04);color:var(--ink);
  font-family:var(--font-sans);font-size:11px;padding:4px 8px;
  outline:none;cursor:pointer;letter-spacing:.02em;
}
.sort-select option{background:#140F0A;color:var(--neon-white)}
.results-bar{margin-bottom:24px}
.results-count{
  font-family:var(--font-sans);font-size:9px;font-weight:400;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);
}
.sezione{margin-bottom:44px}
.sezione-titolo{
  font-family:var(--font-sans);font-size:10px;font-weight:500;
  letter-spacing:.18em;text-transform:uppercase;
  color:var(--neon-pink);
  padding:0 0 9px 16px;
  border-bottom:1px solid rgba(242,230,208,.15);
  margin-bottom:0;
  text-shadow:none;
}

/* ── RIGA VINO ── */
.vino{
  display:flex;align-items:stretch;
  border-bottom:1px solid rgba(242,230,208,.07);
  cursor:pointer;
  transition:background .15s ease;
  position:relative;
}
.vino:hover{background:rgba(242,230,208,.04)}
.vino:first-child{border-top:1px solid rgba(242,230,208,.07)}

.w-accent-bar{
  width:2px;background:var(--accent,rgba(242,230,208,.3));
  flex-shrink:0;opacity:.7;
}
.w-body{
  display:flex;justify-content:space-between;align-items:baseline;
  padding:13px 16px 13px 14px;gap:16px;flex:1;min-width:0;
}
.w-sx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.w-nome{
  font-family:var(--font-serif);font-size:15px;font-weight:400;
  letter-spacing:.01em;color:rgba(242,230,208,.88);line-height:1.3;
  display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;
}
.w-annata{
  font-family:var(--font-sans);font-size:11px;font-weight:400;
  color:rgba(242,230,208,.4);letter-spacing:.02em;
}
.w-formato{
  font-family:var(--font-sans);font-size:9px;font-weight:500;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--neon-pink);opacity:.8;
}
.w-meta{
  font-family:var(--font-sans);font-size:11px;
  color:rgba(242,230,208,.5);display:flex;align-items:center;
  gap:5px;flex-wrap:wrap;
}
.w-prod{
  font-weight:500;letter-spacing:.06em;
  text-transform:uppercase;font-size:10px;
}
.w-vitigno{font-style:normal;color:rgba(242,230,208,.35)}
.w-tipo-label{
  font-size:9px;font-weight:500;
  letter-spacing:.1em;text-transform:uppercase;opacity:.85;
}
.w-geo{
  font-family:var(--font-sans);font-size:10px;font-weight:400;
  color:rgba(242,230,208,.25);letter-spacing:.03em;
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
}
.w-sep{
  color:rgba(242,230,208,.4);font-style:normal;
  font-weight:300;opacity:.6;user-select:none;
}
.w-dx{flex-shrink:0;text-align:right}
.w-price-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.w-price{
  font-family:var(--font-sans);font-size:16px;font-weight:400;
  font-variant-numeric:tabular-nums;
  color:var(--neon-white);
  letter-spacing:-.01em;white-space:nowrap;
  text-shadow:none;
}
.w-calice{
  font-family:var(--font-sans);font-size:10px;
  font-weight:400;color:rgba(242,230,208,.7);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.w-calice::before{content:"↑ ";opacity:.6;font-size:9px}

/* legacy compat */
.vino-calice .w-accent-bar{opacity:.3}
.vino-sx,.vino-dx,.vino-nome,.vino-prod,.vino-vitigno,
.vino-geo,.vino-prezzo,.vino-bicchiere,.vino-annata,
.vino-formato-badge,.vino-regione,.vino-paese-tag,.vino-geo-sep{}
.main-content{padding:20px 20px 40px}
.vuoto{padding:40px 20px;text-align:center;color:var(--grey);font-size:14px;line-height:1.8}

/* ── MODAL ── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.modal-overlay.show{display:flex}
.modal-card{
  background:#0F0B08;
  border:1px solid rgba(242,230,208,.2);
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  border-radius:0;
  box-shadow:0 16px 48px rgba(0,0,0,.6);
  position:relative;
}
.modal-hero-div{
  background:linear-gradient(135deg,rgba(242,230,208,.15),rgba(242,230,208,.05));
  border-bottom:1px solid rgba(242,230,208,.2);
  padding:28px 28px 22px;position:relative;overflow:hidden;border-radius:0;
}
.modal-hero-doodle{position:absolute;right:-20px;top:-10px;height:120%;pointer-events:none;opacity:.18;mix-blend-mode:screen}
.modal-cat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--neon-pink);margin-bottom:6px;position:relative;z-index:1;text-shadow:none}
.modal-nome{font-family:var(--font-serif);font-size:22px;font-weight:400;color:var(--neon-white);line-height:1.25;position:relative;z-index:1;text-shadow:none}
.modal-annata{font-size:13px;color:rgba(242,230,208,.45);margin-top:4px;position:relative;z-index:1}
.modal-prezzo{display:flex;gap:16px;padding:16px 28px;border-bottom:1px solid var(--line)}
.modal-p-item{display:flex;flex-direction:column;gap:2px}
.modal-p-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(242,230,208,.6)}
.modal-p-val{font-family:var(--font-sans);font-size:20px;font-weight:300;color:var(--neon-white);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.modal-body{padding:22px 28px}
.modal-row{display:flex;gap:8px;margin-bottom:8px;font-size:13px}
.modal-lbl{color:rgba(242,230,208,.5);min-width:90px;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding-top:2px;font-weight:600}
.modal-val{color:rgba(242,230,208,.75);font-weight:400}
.modal-close{position:absolute;top:14px;right:16px;font-size:20px;line-height:1;color:rgba(242,230,208,.3);background:none;border:none;cursor:pointer;padding:4px;z-index:5;transition:color .15s}
.modal-close:hover{color:var(--neon-pink);text-shadow:none}

/* ── DRAWER ── */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;backdrop-filter:blur(4px)}
.drawer-overlay.show{display:block}
.filter-drawer{
  position:fixed;bottom:0;left:0;right:0;z-index:110;
  background:#0F0B08;
  border-top:1px solid rgba(242,230,208,.2);
  border-radius:0;
  max-height:78vh;overflow-y:auto;
  overscroll-behavior:contain;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);
  padding:0 20px 40px;
  -webkit-overflow-scrolling:touch;
}
.filter-drawer.open{transform:translateY(0)}
.filter-drawer::before{
  content:'';display:block;
  width:28px;height:1px;
  background:rgba(242,230,208,.3);
  margin:16px auto 4px;
  box-shadow:none;
}
.drawer-handle{display:none}
.drawer-hdr{

  display:flex;align-items:center;justify-content:center;text-align:center;
  font-family:var(--font-display);font-weight:700;font-size:clamp(20px,7vw,44px);
  letter-spacing:-.02em;color:var(--neon-white)}
.pb-neon.pb-noimg img{visibility:hidden}

/* ── REVEAL lento ───────────────────────────────────────────────────────── */
.pb-rv{opacity:0;transform:translateY(28px);filter:blur(9px);
  transition:opacity 1.9s cubic-bezier(.16,1,.3,1),transform 1.9s cubic-bezier(.16,1,.3,1),filter 1.9s cubic-bezier(.16,1,.3,1)}
.pb-landing.on .pb-rv{opacity:1;transform:none;filter:blur(0)}
.pb-landing.on .d1{transition-delay:0s}   .pb-landing.on .d2{transition-delay:.42s}
.pb-landing.on .d3{transition-delay:.84s} .pb-landing.on .d4{transition-delay:1.26s}
.pb-landing.on .d5{transition-delay:1.68s}

/* ── LANDING ────────────────────────────────────────────────────────────── */
.pb-landing{display:none;position:fixed;inset:0;z-index:120;background:#0A0806;color:var(--neon-white);overflow:hidden}
body.view-landing .pb-landing{display:block}
body.view-landing .sidebar-col,body.view-landing .wine-col,
body.view-landing .filter-fab,body.view-landing .pb-back{display:none!important}

.pb-gallery{position:absolute;inset:0;overflow:hidden;background:#000}
.pb-g1{position:absolute;inset:0;background-size:cover;
  animation:pbKb 34s ease-in-out infinite alternate;filter:saturate(.86) contrast(1.04) brightness(.62)}
@keyframes pbKb{from{transform:scale(1)}to{transform:scale(1.05)}}
.pb-grain{position:absolute;inset:0;pointer-events:none;opacity:.05;z-index:8;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}

.pb-gtop{position:absolute;z-index:9;display:flex;gap:22px;align-items:center}
.pb-wordmark{font-family:var(--font-sans);font-size:10px;font-weight:500;letter-spacing:.42em;text-transform:uppercase;color:rgba(242,230,208,.7)}
.pb-meta{font-family:var(--font-sans);font-size:9.5px;font-weight:400;letter-spacing:.26em;text-transform:uppercase;color:rgba(242,230,208,.55)}
.pb-tagline{font-family:var(--font-display);font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:rgba(242,230,208,.66)}
.pb-ttl{font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:.98}

.pb-cta{display:flex;align-items:center;justify-content:space-between;gap:18px;width:100%;
  border-radius:26px;border:1px solid rgba(242,230,208,.15);background:rgba(242,230,208,.03);
  padding:19px 26px;color:var(--neon-white);text-align:left;cursor:pointer;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  transition:border-color .7s cubic-bezier(.16,1,.3,1),background .7s cubic-bezier(.16,1,.3,1),box-shadow .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
.pb-cta .lbl{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.015em;display:block;transition:color .5s,text-shadow .5s}
.pb-cta .sub{font-family:var(--font-sans);font-size:10px;font-weight:400;letter-spacing:.11em;text-transform:uppercase;color:rgba(242,230,208,.56);margin-top:5px;display:block;transition:color .5s}
.pb-cta .arw{font-size:16px;color:rgba(242,230,208,.58);transition:transform .7s cubic-bezier(.16,1,.3,1),color .7s}
.pb-cta:hover,.pb-cta.sel{
  border-color:rgba(242,230,208,.34);background:rgba(242,230,208,.11);
  transform:translateY(-2px)}
.pb-cta:hover .lbl,.pb-cta.sel .lbl{color:var(--neon-white);text-shadow:none}
.pb-cta:hover .sub,.pb-cta.sel .sub{color:rgba(242,230,208,.6)}
.pb-cta:hover .arw{transform:translateX(6px);color:var(--neon-hot)}
.pb-cta:active{transform:translateY(0);box-shadow:none}
.pb-ctas{display:flex;flex-direction:column;gap:13px}
.pb-foot .pb-meta{white-space:nowrap}

/* Landing — DESKTOP */

/* ═══════════════════════════════════════════════════════════════════════════

.vino-sx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vino-dx{flex-shrink:0;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}

/* nome del vino */
.vino-nome{
  font-family:var(--font-display);font-weight:700;font-size:17px;letter-spacing:-.014em;
  color:rgba(242,230,208,.96);line-height:1.24;
  display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.vino-annata{

.vino-prod{
  font-family:var(--font-display);font-weight:700;font-size:12px;
  letter-spacing:.115em;text-transform:uppercase;color:rgba(242,230,208,.64);
  line-height:1.5;margin-top:2px}

/* vitigno: terzo livello, caso normale, piu' tenue */

  color:rgba(242,230,208,.4);line-height:1.45}

.vino-geo{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:2px}
.vino-regione,.vino-paese-tag{

/* micro-UI: stessa voce, corpo minimo, spaziatura massima */

@keyframes pbRowIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

<script>
/* ═══════════════════════════════════════════════════════════════════════
   PALINUROBAR — LANDING / NAVIGAZIONE V2
   ═══════════════════════════════════════════════════════════════════════ */
(function(){
  var landing = document.getElementById("pb-landing");
  var neon    = document.getElementById("pb-neon");
  var _t1 = null;

  /* fallback se il PNG del logo non arriva */
  if(neon){
    var _lg = neon.querySelector("img");
    if(_lg){
      if(_lg.complete){ if(_lg.naturalWidth === 0) neon.classList.add("pb-noimg"); }
      else _lg.addEventListener("error", function(){ neon.classList.add("pb-noimg"); });
    }
  }

  function runIntro(){
    clearTimeout(_t1);
    if(!landing) return;
    landing.classList.remove("on");
    void landing.offsetWidth;
    _t1 = setTimeout(function(){ landing.classList.add("on"); }, 250);
  }
  function stopIntro(){ clearTimeout(_t1); }
  window.pbRunIntro = runIntro;

  /* ── navigazione ─────────────────────────────────────────────────── */
  function syncChrome(view){
    document.querySelectorAll(".btn-view").forEach(function(b){
      var on = b.getAttribute("data-view") === view;
      b.classList.toggle("active", on);
      b.setAttribute("aria-current", on ? "page" : "false");
    });
    var back = document.getElementById("pb-back");
    if(back) back.setAttribute("aria-hidden", view === "landing" ? "true" : "false");
  }

  /* ── fasce di prezzo ───────────────────────────────────────────────
     pMin/pMax/pMaxG sono globali di carta.js: si scrivono direttamente
     e si rigenera la sidebar cosi' gli slider restano allineati. */
  var chips = document.getElementById("pb-price-chips");
  if(chips){
    chips.addEventListener("click", function(ev){
      var c = ev.target.closest(".pb-chip");
      if(!c || typeof applyFilters !== "function") return;
      var lo = parseInt(c.getAttribute("data-min"), 10) || 0;
      var hiAttr = c.getAttribute("data-max");
      window.pMin = lo;
      window.pMax = hiAttr ? parseInt(hiAttr, 10) : window.pMaxG;
      chips.querySelectorAll(".pb-chip").forEach(function(x){
        x.setAttribute("aria-pressed", x === c ? "true" : "false");
      });
      applyFilters();
      if(typeof buildSidebar === "function") buildSidebar();
    });
  }
  window.pbEnter = function(view){ stopIntro(); if(typeof setView==="function") setView(view); };
  window.backToLanding = function(){
    if(typeof setView === "function") setView("landing");
    else document.body.className = "view-landing";
    runIntro();
  };
  window.setViewMobile = window.pbEnter;   /* compatibilita' col markup precedente */

  /* setView vive in carta.js: lo si avvolge appena disponibile.
     carta.js riassegna body.className, quindi il sync va DOPO. */
  var iv = setInterval(function(){
    if(typeof window.setView === "function" && !window.setView.__pb){
      var orig = window.setView;
      var wrapped = function(v){ orig(v); syncChrome(v); };
      wrapped.__pb = true;
      window.setView = wrapped;
      clearInterval(iv);
    }
  }, 40);

  /* ── entrata a cascata delle righe ────────────────────────────────
     Osserva le liste renderizzate da carta.js: nessuna modifica al suo codice.
     Anima solo le prime righe, il resto compare subito (283 etichette). */
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(!reduce){
    var MAX = 22, STEP = 26;
    function stagger(root){
      var rows = root.querySelectorAll(".vino, .lista-row, .sezione-titolo");
      for(var i=0;i<rows.length && i<MAX;i++){
        rows[i].classList.remove("pb-stagger");
        void rows[i].offsetWidth;
        rows[i].style.animationDelay = (i*STEP) + "ms";
        rows[i].classList.add("pb-stagger");
      }
    }
    var mo = new MutationObserver(function(muts){
      for(var i=0;i<muts.length;i++){
        if(muts[i].addedNodes.length){ stagger(muts[i].target); break; }
      }
    });
    ["wine-list","calice-list","mescita-list"].forEach(function(id){
      var el = document.getElementById(id);
      if(el) mo.observe(el, {childList:true});
    });
  }

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && !document.body.classList.contains("view-landing")){
      var m = document.getElementById("modal");
      if(!m || !m.classList.contains("show")) backToLanding();
    }
  });

  if(document.fonts && document.fonts.ready){ document.fonts.ready.then(function(){ setTimeout(runIntro,120); }); }
  else { window.addEventListener("load", function(){ setTimeout(runIntro,250); }); }
})();
</script>
